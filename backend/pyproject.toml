[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "anonymous",email = "anonymous@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.3.1,<2.0.0)",
    "langgraph (>=1.2.0,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-postgres (>=0.0.17,<0.0.18)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "pypdf (>=6.11.0,<7.0.0)",
    "docx (>=0.2.4,<0.3.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "psycopg (>=3.3.4,<4.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
